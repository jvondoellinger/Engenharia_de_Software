<!-- topbar.html -->

<div class="topbar d-flex justify-content-between align-items-center px-4 py-3">

  <!-- Left -->
  <div>
    <h2 class="fw-bold mb-1">
      Olá, Professor(a)! 👋
    </h2>

    <p class="text-secondary m-0">
      Acompanhe o desempenho das suas turmas em um só lugar.
    </p>
  </div>

  <!-- Right -->
  <div class="d-flex align-items-center gap-4">

    <!-- Search -->
    <div class="search-box d-flex align-items-center px-3">

      <i class="bi bi-search text-secondary"></i>

      <input
        type="text"
        placeholder="Buscar turmas, alunos ou avaliações..."
        class="form-control border-0 shadow-none">

    </div>

    <!-- Avatar -->
    <div class="d-flex align-items-center gap-3">

      <img
        src="https://i.pravatar.cc/100"
        class="avatar"
        alt="avatar">

      <i class="bi bi-chevron-down"></i>

    </div>

  </div>

</div>
