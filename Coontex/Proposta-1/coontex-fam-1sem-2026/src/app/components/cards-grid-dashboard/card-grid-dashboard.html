<!-- dashboard-cards.html -->

<div class="cards-grid">

  @for (card of cards; track card.title) {

    <app-card
      [title]="card.title"
      [students]="card.students"
      [currentAverage]="card.currentAverage"
      [previousAverage]="card.previousAverage"
      [evaluations]="card.evaluations"
      [alerts]="card.alerts">
    </app-card>

  }

</div>
